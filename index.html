<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой 2007</title>
    <!-- Подключаем тему Windows XP -->
    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <style>
        body {
            background: teal; /* Фон как в XP */
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="window" style="margin: 32px; width: 350px;">
        <div class="title-bar">
            <div class="title-bar-text">Выбор пункта ностальгии</div>
        </div>
        <div class="window-body">
            <p>Выберите период:</p>
            <!-- Элемент выпадающего списка -->
            <select id="mySelect">
                <option value="0">-- 2007 --</option>
                <option value="1">1998</option>
                <option value="2">2000</option>
                <option value="3">2013</option>
                <option value="4">2016</option>
                <option value="3">2026</option>
            </select>
            <p style="margin-top: 10px; font-size: 12px; color: #555; text-align: center;">
                ВНИМАНИЕ!!! Никто, никогда не вернётся в 2007-й...
            </p>
        </div>
    </div>
    <audio id="myAudio" src="WinXP_startup.mp3"></audio>
    <script>
        const select = document.getElementById('mySelect');
        const firstOption = select.options[0];
        const audio = document.getElementById('myAudio');

        // --- Логика для выпадающего списка ---
        select.addEventListener('change', function() {
            if (this.selectedIndex !== 0) {
                firstOption.disabled = true;
            } else {
                firstOption.disabled = false;
            }
        });

        // --- Логика для музыки ---
        // Пробуем воспроизвести при первом клике по странице (обход автоблокировки)
        document.addEventListener('click', function playAudio() {
            audio.play().catch(function(error) {
                console.log('Автовоспроизведение заблокировано. Нажмите на страницу.');
            });
            // Удаляем обработчик после первого клика, чтобы он не срабатывал повторно
            document.removeEventListener('click', playAudio);
        });

        // Альтернативный вариант: попытаться запустить сразу (может не сработать)
        // audio.play().catch(e => console.log('Нужен клик для воспроизведения'));
    </script>
</body>
</html>
